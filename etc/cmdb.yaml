Name: cmdb.rpc
ListenOn: 0.0.0.0:9201

DatabaseConf:
  Type: mysql
  Host: 192.168.26.130
  Port: 3306
  DBName: newbee
  Username: root # set your username
  Password: "123456" # set your password
  MaxOpenConn: 100
  SSLMode: disable
  CacheTime: 5

RedisConf:
  Host: 192.168.26.130:6380
  Db: 0

Log:
  ServiceName: cmdbRpcLogger  
  Mode: console
  Path: /home/data/logs/cmdb/rpc
  Encoding: json
  Level: info
  Compress: false
  KeepDays: 7
  StackCoolDownMillis: 100

CasbinConf:
  ModelText: |
    [request_definition]
    r = sub, obj, act
    [policy_definition]
    p = sub, obj, act
    [role_definition]
    g = _, _
    [policy_effect]
    e = some(where (p.eft == allow))
    [matchers]
    m = r.sub == p.sub && keyMatch2(r.obj,p.obj) && r.act == p.act

Prometheus:
  Host: 0.0.0.0
  Port: 4002
  Path: /metrics

# 输入适配器配置
InputAdapterConf:
  # 健康检查配置
  HealthCheck:
    Enable: true
    Interval: 30s
    DatabaseCheck: true
    RedisCheck: true
    MemoryThreshold: 90
    
  # 性能配置
  Performance:
    ConcurrentWorkers: 8      # 并发工作协程数
    BatchSize: 1000          # 批处理大小
    MemoryLimit: 100MB       # 内存限制
    ProcessTimeout: 30s      # 处理超时
    
  # Excel适配器配置
  Excel:
    MaxRows: 100000         # 最大行数
    MaxFileSize: 50MB       # 最大文件大小
    StreamProcess: true     # 启用流式处理
    ChunkSize: 1MB          # 流处理块大小
    
  # API适配器配置
  API:
    MaxBatchSize: 5000      # 最大批量处理数
    Timeout: 30s           # 请求超时
    MaxConcurrent: 16      # 最大并发连接数
    
  # 自动发现适配器配置
  Discovery:
    Disabled: true         # 功能已迁移到Agent
    MigrationGuide: "请使用Agent服务进行网络发现"
