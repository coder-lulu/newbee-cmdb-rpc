syntax = "proto3";

package cmdb;
option go_package="./cmdb";

// Cis message

// CI实例属性值
message CiAttributeValue {
  // 属性ID
  uint64 attr_id = 1;
  // 属性名称（冗余字段，便于前端使用）
  string attr_name = 2;
  // 属性别名
  string attr_alias = 3;
  // 属性值类型
  string value_type = 4;
  // 属性值（根据类型格式化的字符串）
  string value = 5;
  // 原始值（用于编辑，JSON格式）
  optional string raw_value = 6;
}

// 高级属性过滤条件
message CiAttributeFilter {
  // 属性ID
  uint64 attr_id = 1;
  // 属性名称（可选，用于调试）
  optional string attr_name = 2;
  // 属性值类型（用于类型转换）
  string value_type = 3;
  // 操作符
  string operator = 4;
  // 过滤值（JSON格式存储）
  optional string value = 5;
  // 多个值（JSON数组格式）
  optional string values = 6;
  // 列表过滤模式：any(任意匹配), all(全部匹配), exact(精确匹配)
  optional string list_mode = 7;
}

// 复合过滤条件组
message CiFilterGroup {
  // 逻辑操作符：and, or
  string logic = 1;
  // 属性过滤条件列表
  repeated CiAttributeFilter filters = 2;
  // 嵌套过滤组
  repeated CiFilterGroup groups = 3;
}

// 排序条件
message CiSortField {
  // 属性ID（0表示基础字段）
  uint64 attr_id = 1;
  // 字段名称（基础字段：id, created_at, updated_at, type_id等）
  optional string field_name = 2;
  // 排序方向：asc, desc
  string direction = 3;
  // 数据类型（用于正确排序）
  optional string value_type = 4;
}

// === 增强搜索功能 ===

// 关系过滤条件
message CiRelationFilter {
  // 关系类型编码
  string relation_type = 1;
  // 关系方向: incoming(入关系), outgoing(出关系), both(双向)
  string direction = 2;
  // 目标CI ID列表
  repeated uint64 target_ci_ids = 3;
  // 目标CI类型ID列表
  repeated uint64 target_type_ids = 4;
  // 关系深度，0表示直接关系
  optional int32 relation_depth = 5;
  // 是否包含间接关系
  optional bool include_indirect = 6;
}

// 继承搜索条件
message CiInheritanceSearch {
  // 是否包含子类型
  optional bool include_children = 1;
  // 是否包含父类型
  optional bool include_parents = 2;
  // 指定类型层级
  repeated uint64 type_hierarchy = 3;
}

// 标签过滤条件
message CiTagFilter {
  // 标签键
  string key = 1;
  // 标签值列表
  repeated string values = 2;
  // 操作符: eq, ne, in, not_in, exists, not_exists
  string operator = 3;
}

// 元数据过滤条件
message CiMetadataFilter {
  // JSON路径，如 "system.version"
  string path = 1;
  // 过滤值
  optional string value = 2;
  // 操作符: eq, ne, gt, lt, contains, exists
  string operator = 3;
}

// 时间范围搜索条件
message CiTimeRangeSearch {
  // 时间字段: created_at, updated_at 或属性ID
  string field = 1;
  // 开始时间（毫秒时间戳）
  optional int64 start_time = 2;
  // 结束时间（毫秒时间戳）
  optional int64 end_time = 3;
  // 时间间隔：hour, day, week, month
  optional string interval = 4;
}

// 分面搜索条件
message CiFacetSearch {
  // 需要分面统计的字段
  repeated string fields = 1;
  // 每个分面返回的项目数量
  optional int32 size = 2;
}

message CisMetadata {
  optional string key = 1;
  optional string value = 2;
}

message CisInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  // 外键，关联cmdb_ci_types.id
  optional uint64 type_id = 4;
  // 状态，枚举类型
  optional uint32 status = 5;
  // 心跳时间
  optional int64 heartbeat = 6;
  // 是否可用
  optional bool available = 7;
  // 创建者
  optional string created_by = 8;
  // 标签
  repeated string tags = 9;
  // 元数据
  repeated CisMetadata metadata = 10;
  // 自定义字段
  repeated CisMetadata custom_fields = 11;
  
  // 动态属性值列表（查询时返回）
  repeated CiAttributeValue attributes = 12;
}

message CisListResp {
  uint64 total = 1;
  repeated CisInfo data = 2;
  // 聚合统计信息（JSON格式）
  optional string aggregations = 3;
}

message CisListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  
  // === 基础字段过滤 ===
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional int64 deleted_at = 5;
  optional uint64 type_id = 6;
  optional uint32 status = 7;
  optional int64 heartbeat = 8;
  optional bool available = 9;
  optional string updated_by = 10;
  
  // === 高级过滤条件 ===
  // 简单属性过滤（向后兼容）
  repeated CiAttributeFilter attribute_filters = 11;
  
  // 复合过滤条件（支持复杂逻辑）
  repeated CiFilterGroup filter_groups = 12;
  
  // 全文搜索（在所有文本属性中搜索）
  optional string search = 13;
  
  // 搜索范围（指定搜索的属性ID列表）
  repeated uint64 search_fields = 14;
  
  // === 增强搜索功能 ===
  // 关系过滤（基于CI间关系搜索）
  repeated CiRelationFilter relation_filters = 21;
  
  // 继承搜索（基于CI类型继承关系）
  optional CiInheritanceSearch inheritance_search = 22;
  
  // 标签过滤（基于CI标签搜索）
  repeated CiTagFilter tag_filters = 23;
  
  // 元数据过滤（基于CI元数据搜索）
  repeated CiMetadataFilter metadata_filters = 24;
  
  // 时间范围搜索
  optional CiTimeRangeSearch time_range_search = 25;
  
  // 分面搜索
  optional CiFacetSearch facet_search = 26;
  
  // === 排序和聚合 ===
  // 排序字段
  repeated CiSortField sort_fields = 15;
  
  // 是否返回聚合统计
  optional bool with_aggregations = 16;
  
  // 聚合字段列表
  repeated uint64 aggregation_fields = 17;
  
  // === 返回字段控制 ===
  // 返回的属性ID列表（空表示返回所有）
  repeated uint64 include_attributes = 18;
  
  // 排除的属性ID列表
  repeated uint64 exclude_attributes = 19;
  
  // 是否包含属性值
  optional bool with_attributes = 20;
  
  // === 搜索引擎控制 ===
  // 强制使用增强搜索引擎
  optional bool force_enhanced_search = 27;
}

// CI实例详情（包含属性定义信息）
message CisDetailInfo {
  // 基础信息
  CisInfo ci_info = 1;
  // CI类型名称
  string ci_type_name = 2;
  // CI类型别名
  string ci_type_alias = 3;
}

// 批量操作请求
message CisBatchOperationReq {
  // 操作类型：update, delete, change_status
  string operation = 1;
  // CI ID列表
  repeated uint64 ci_ids = 2;
  // 操作参数（JSON格式）
  optional string params = 3;
}

// 属性值验证请求
message CisAttributeValidateReq {
  uint64 type_id = 1;
  repeated CiAttributeValue attributes = 2;
}

// 属性错误信息
message CiAttributeError {
  uint64 attr_id = 1;
  string attr_name = 2;
  string error_type = 3;
  string message = 4;
}

// 属性值验证响应
message CisAttributeValidateResp {
  // 验证结果
  bool valid = 1;
  // 错误信息
  repeated CiAttributeError errors = 2;
}

// 基础消息定义
message IDReq {
  uint64 id = 1;
}

message IDsReq {
  repeated uint64 ids = 1;
}

message BaseIDResp {
  uint64 id = 1;
  string msg = 2;
}

message BaseResp {
  string msg = 1;
}

service Cmdb {

  // Cis management
  // group: cis
  rpc createCis (CisInfo) returns (BaseIDResp);
  // group: cis
  rpc updateCis (CisInfo) returns (BaseResp);
  // group: cis
  rpc getCisList (CisListReq) returns (CisListResp);
  // group: cis
  rpc getCisById (IDReq) returns (CisInfo);
  // group: cis
  rpc getCisDetailById (IDReq) returns (CisDetailInfo);
  // group: cis
  rpc deleteCis (IDsReq) returns (BaseResp);
  // group: cis
  rpc cisBatchOperation (CisBatchOperationReq) returns (BaseResp);
  // group: cis
  rpc validateCisAttributes (CisAttributeValidateReq) returns (CisAttributeValidateResp);

}