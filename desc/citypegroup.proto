syntax = "proto3";

// CiTypeGroup message

message CiTypeGroupInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  // Sort Number | 排序编号
  optional uint32 sort = 4;
  // 分组名称
  optional string name = 5;
  // 分组描述
  optional string description = 6;
  // 分组图标
  optional string icon = 7;
}

message CiTypeGroupListResp {
  uint64 total = 1;
  repeated CiTypeGroupInfo data = 2;
}

message CiTypeGroupListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional int64 deleted_at = 5;
  optional uint32 sort = 6;
  optional string name = 7;
}

message CiTypeGroupSort{
  uint64 group_id = 1;
  uint32 sort = 2;
}

message CiTypeGroupSortReq{
  repeated CiTypeGroupSort data = 1;
}


service Cmdb {

  // CiTypeGroup management
  // group: citypegroup
  rpc createCiTypeGroup (CiTypeGroupInfo) returns (BaseIDResp);
  // group: citypegroup
  rpc updateCiTypeGroup (CiTypeGroupInfo) returns (BaseResp);
  // group: citypegroup
  rpc getCiTypeGroupList (CiTypeGroupListReq) returns (CiTypeGroupListResp);
  // group: citypegroup
  rpc getCiTypeGroupById (IDReq) returns (CiTypeGroupInfo);
  // group: citypegroup
  rpc deleteCiTypeGroup (IDsReq) returns (BaseResp);
  // group: citypegroup
  rpc updateCiTypeGroupSort (CiTypeGroupSortReq) returns (BaseResp);

}