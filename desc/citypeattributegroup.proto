syntax = "proto3";

// CiTypeAttributeGroup message

message CiTypeAttributeGroupInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  // Sort Number | 排序编号
  optional uint32 sort = 4;
  // 分组名称
  optional string name = 5;
  // 外键，关联cmdb_ci_types.id
  optional uint64 type_id = 6;
}

message CiTypeAttributeGroupListResp {
  uint64 total = 1;
  repeated CiTypeAttributeGroupInfo data = 2;
}

message CiTypeAttributeGroupListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional int64 deleted_at = 5;
  optional uint32 sort = 6;
  optional string name = 7;
  optional uint64 type_id = 8;
}

message CiTypeAttributeGroupSort {
  uint64 group_id = 1;
  string name = 2;
  uint32 sort = 3;
}

message CiTypeAttributeGroupSortReq {
  repeated CiTypeAttributeGroupSort data = 1;
}

service Cmdb {

  // CiTypeAttributeGroup management
  // group: citypeattributegroup
  rpc createCiTypeAttributeGroup (CiTypeAttributeGroupInfo) returns (BaseIDResp);
  // group: citypeattributegroup
  rpc updateCiTypeAttributeGroup (CiTypeAttributeGroupInfo) returns (BaseResp);
  // group: citypeattributegroup
  rpc getCiTypeAttributeGroupList (CiTypeAttributeGroupListReq) returns (CiTypeAttributeGroupListResp);
  // group: citypeattributegroup
  rpc getCiTypeAttributeGroupById (IDReq) returns (CiTypeAttributeGroupInfo);
  // group: citypeattributegroup
  rpc deleteCiTypeAttributeGroup (IDsReq) returns (BaseResp);
  // group: citypeattributegroup
  rpc sortCiTypeAttributeGroup (CiTypeAttributeGroupSortReq) returns (BaseResp);

}