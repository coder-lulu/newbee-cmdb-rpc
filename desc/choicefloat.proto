syntax = "proto3";

// ChoiceFloat message

message ChoiceFloatInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  // 外键，关联cmdb_attributes.id
  optional uint64 attr_id = 4;
  // 选项值
  optional double value = 5;
  // 选项内容
  optional AttributeChoiceItemMeta option = 6;
}

message ChoiceFloatListResp {
  uint64 total = 1;
  repeated ChoiceFloatInfo data = 2;
}

message ChoiceFloatListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional int64 deleted_at = 5;
  optional uint64 attr_id = 6;
  optional double value = 7;
  optional AttributeChoiceItemMeta option = 8;
}


service Cmdb {

  // ChoiceFloat management
  // group: choicefloat
  rpc createChoiceFloat (ChoiceFloatInfo) returns (BaseIDResp);
  // group: choicefloat
  rpc updateChoiceFloat (ChoiceFloatInfo) returns (BaseResp);
  // group: choicefloat
  rpc getChoiceFloatList (ChoiceFloatListReq) returns (ChoiceFloatListResp);
  // group: choicefloat
  rpc getChoiceFloatById (IDReq) returns (ChoiceFloatInfo);
  // group: choicefloat
  rpc deleteChoiceFloat (IDsReq) returns (BaseResp);


}