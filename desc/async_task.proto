syntax = "proto3";

package cmdb;
option go_package="./cmdb";

// 异步任务相关消息定义
message AsyncTaskReq {
  string type = 1;              // 任务类型：batch_import/batch_delete/batch_update
  string operation = 2;         // 操作类型
  repeated uint64 ci_ids = 3;   // CI ID列表（用于批量操作）
  optional string params = 4;   // 操作参数（JSON格式）
  optional string data = 5;     // 任务数据（JSON格式）
  optional int32 priority = 6;  // 任务优先级 1-low 2-normal 3-high
  optional string created_by = 7; // 创建者
}

message AsyncTaskResp {
  string task_id = 1;           // 任务ID
  string message = 2;           // 响应消息
  bool success = 3;             // 是否成功
  optional TaskStatusInfo initial_status = 4; // 初始任务状态
}

message TaskStatusReq {
  string task_id = 1;           // 任务ID
}

message TaskStatusResp {
  TaskStatusInfo task = 1;      // 任务状态信息
}

message TaskCancelReq {
  string task_id = 1;           // 要取消的任务ID
  optional string reason = 2;   // 取消原因
}

message TaskListReq {
  uint64 page = 1;              // 页码
  uint64 page_size = 2;         // 每页大小
  optional string type = 3;     // 任务类型过滤
  optional string status = 4;   // 任务状态过滤
  optional string created_by = 5; // 创建者过滤
  optional int64 start_time = 6;  // 开始时间过滤
  optional int64 end_time = 7;    // 结束时间过滤
}

message TaskListResp {
  uint64 total = 1;             // 总数
  repeated TaskStatusInfo tasks = 2; // 任务列表
}

message TaskStatusInfo {
  string id = 1;                // 任务ID
  string type = 2;              // 任务类型
  string status = 3;            // 任务状态：pending/processing/completed/failed/cancelled
  int32 priority = 4;           // 优先级
  TaskProgressInfo progress = 5; // 任务进度
  optional TaskResultInfo result = 6; // 任务结果（完成时）
  int64 create_time = 7;        // 创建时间（Unix时间戳）
  int64 update_time = 8;        // 更新时间（Unix时间戳）
  optional int64 start_time = 9; // 开始时间（Unix时间戳）
  optional int64 end_time = 10;  // 结束时间（Unix时间戳）
  string created_by = 11;       // 创建者
  optional string error = 12;   // 错误信息（失败时）
}

message TaskProgressInfo {
  int32 total_items = 1;        // 总项目数
  int32 processed_items = 2;    // 已处理项目数
  int32 success_items = 3;      // 成功项目数
  int32 failed_items = 4;       // 失败项目数
  float percentage = 5;         // 完成百分比
  string current_step = 6;      // 当前步骤
  optional int64 estimated_remaining = 7; // 预估剩余时间（秒）
  optional float throughput_per_sec = 8;  // 吞吐量（项/秒）
}

message TaskResultInfo {
  bool success = 1;             // 是否成功
  int32 processed_count = 2;    // 处理总数
  int32 success_count = 3;      // 成功总数
  int32 failed_count = 4;       // 失败总数
  int32 skipped_count = 5;      // 跳过总数
  int64 process_time_ms = 6;    // 处理耗时（毫秒）
  float throughput_per_sec = 7; // 平均吞吐量（项/秒）
  repeated string successful_assets = 8; // 成功的资产ID列表
  repeated string failed_assets = 9;     // 失败的资产ID列表
  optional string summary = 10;          // 结果汇总（JSON格式）
}

// 异步任务统计信息
message TaskStatsReq {
  optional string type = 1;     // 任务类型过滤
  optional int64 start_time = 2; // 统计开始时间
  optional int64 end_time = 3;   // 统计结束时间
}

message TaskStatsResp {
  TaskStatistics stats = 1;     // 统计信息
}

message TaskStatistics {
  int32 total_tasks = 1;        // 总任务数
  int32 pending_tasks = 2;      // 待处理任务数
  int32 processing_tasks = 3;   // 处理中任务数
  int32 completed_tasks = 4;    // 已完成任务数
  int32 failed_tasks = 5;       // 失败任务数
  int32 cancelled_tasks = 6;    // 已取消任务数
  float average_processing_time = 7; // 平均处理时间（分钟）
  float success_rate = 8;       // 成功率（百分比）
  repeated TaskTypeStats type_stats = 9; // 按类型统计
}

message TaskTypeStats {
  string type = 1;              // 任务类型
  int32 count = 2;              // 任务数量
  float success_rate = 3;       // 成功率
  float avg_processing_time = 4; // 平均处理时间
}

// 基础消息定义
message BaseResp {
  string msg = 1;
}

service Cmdb {
  // 异步任务管理接口
  // group: async_task
  rpc SubmitAsyncTask(AsyncTaskReq) returns (AsyncTaskResp);
  // group: async_task
  rpc GetTaskStatus(TaskStatusReq) returns (TaskStatusResp);
  // group: async_task
  rpc CancelTask(TaskCancelReq) returns (BaseResp);
  // group: async_task
  rpc GetTaskList(TaskListReq) returns (TaskListResp);
  // group: async_task
  rpc GetTaskStats(TaskStatsReq) returns (TaskStatsResp);
} 