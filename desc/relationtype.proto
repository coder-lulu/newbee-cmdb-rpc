syntax = "proto3";

// RelationType message

message RelationTypeInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  // 关系类型名称
  optional string name = 4;
  // 关系类型编码
  optional string code = 5;
  // 关系类型分类
  optional string category = 6;
  // 关系类型方向
  optional string direction = 7;
}

message RelationTypeListResp {
  uint64 total = 1;
  repeated RelationTypeInfo data = 2;
}

message RelationTypeListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional int64 deleted_at = 5;
  optional string name = 6;
}


service Cmdb {

  // RelationType management
  // group: relationtype
  rpc createRelationType (RelationTypeInfo) returns (BaseIDResp);
  // group: relationtype
  rpc updateRelationType (RelationTypeInfo) returns (BaseResp);
  // group: relationtype
  rpc getRelationTypeList (RelationTypeListReq) returns (RelationTypeListResp);
  // group: relationtype
  rpc getRelationTypeById (IDReq) returns (RelationTypeInfo);
  // group: relationtype
  rpc deleteRelationType (IDsReq) returns (BaseResp);


}