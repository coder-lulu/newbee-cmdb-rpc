syntax = "proto3";

// ChoiceText message

message ChoiceTextInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  // 外键，关联cmdb_attributes.id
  optional uint64 attr_id = 4;
  // 选项内容
  optional string value = 5;
  // 选项内容
  optional AttributeChoiceItemMeta option = 6;
}

message ChoiceTextListResp {
  uint64 total = 1;
  repeated ChoiceTextInfo data = 2;
}

message ChoiceTextListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional int64 deleted_at = 5;
  optional uint64 attr_id = 6;
  optional string value = 7;
  optional AttributeChoiceItemMeta option = 8;
}


service Cmdb {

  // ChoiceText management
  // group: choicetext
  rpc createChoiceText (ChoiceTextInfo) returns (BaseIDResp);
  // group: choicetext
  rpc updateChoiceText (ChoiceTextInfo) returns (BaseResp);
  // group: choicetext
  rpc getChoiceTextList (ChoiceTextListReq) returns (ChoiceTextListResp);
  // group: choicetext
  rpc getChoiceTextById (IDReq) returns (ChoiceTextInfo);
  // group: choicetext
  rpc deleteChoiceText (IDsReq) returns (BaseResp);


}