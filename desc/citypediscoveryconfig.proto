syntax = "proto3";

// CiTypeDiscoveryConfig message

message CiTypeDiscoveryConfigInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  // Status 1: normal 2: ban | 状态 1 正常 2 禁用
  optional uint32 status = 4;
  // Department ID | 部门 ID
  optional uint64 department_id = 5;
  // Created user's UUID | 创建者 UUID
  optional string created_by = 6;
  // CI类型ID
  optional uint64 ci_type_id = 7;
  // 配置名称
  optional string config_name = 8;
  // 配置描述
  optional string description = 9;
  // 发现模式: attribute, relation, dependency
  optional string discovery_mode = 10;
  // 发现类型: file, api, sdk, builtin, agent
  optional string discovery_type = 11;
  // 发现提供者ID
  optional string provider_id = 12;
  // 提供者配置JSON
  optional string provider_config = 13;
  // 属性映射配置JSON
  optional string attribute_mappings = 14;
  // 发现规则JSON
  optional string discovery_rules = 15;
  // 过滤条件JSON
  optional string filter_conditions = 16;
  // 执行模式: manual, scheduled, triggered
  optional string execution_mode = 17;
  // 调度配置JSON
  optional string schedule_config = 18;
  // 优先级(数字越小优先级越高)
  optional int64 priority = 19;
  // 批处理大小
  optional int64 batch_size = 20;
  // 超时时间(秒)
  optional int64 timeout_seconds = 21;
  // 冲突解决策略: priority, merge, latest
  optional string conflict_resolution = 22;
  // 是否自动创建CI实例
  optional bool auto_create_ci = 23;
  // 是否自动更新属性
  optional bool auto_update_attributes = 24;
  // 通知配置JSON
  optional string notification_config = 25;
  // 是否启用
  optional bool enabled = 26;
  // 状态: active, inactive, error
  optional string config_status = 27;
  // 上次执行时间
  optional int64  last_executed_at = 28;
  // 下次执行时间
  optional int64  next_execution_at = 29;
  // 执行统计JSON
  optional string execution_stats = 30;
  // 最后错误信息
  optional string last_error = 31;
}

message CiTypeDiscoveryConfigListResp {
  uint64 total = 1;
  repeated CiTypeDiscoveryConfigInfo data = 2;
}

message CiTypeDiscoveryConfigListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional uint32 status = 5;
  optional int64 deleted_at = 6;
  optional uint64 department_id = 7;
  optional string created_by = 8;
  optional uint64 ci_type_id = 9;
  optional string config_name = 10;
  optional string description = 11;
  optional string discovery_mode = 12;
  optional string discovery_type = 13;
  optional string provider_id = 14;
  optional string provider_config = 15;
  optional string attribute_mappings = 16;
  optional string discovery_rules = 17;
  optional string filter_conditions = 18;
  optional string execution_mode = 19;
  optional string schedule_config = 20;
  optional int64 priority = 21;
  optional int64 batch_size = 22;
  optional int64 timeout_seconds = 23;
  optional string conflict_resolution = 24;
  optional bool auto_create_ci = 25;
  optional bool auto_update_attributes = 26;
  optional string notification_config = 27;
  optional bool enabled = 28;
  optional string config_status = 29;
  optional int64 last_executed_at = 30;
  optional int64 next_execution_at = 31;
  optional string execution_stats = 32;
  optional string last_error = 33;
}

message DiscoveryExecutionResp {
  string execution_id = 1;
  uint64 config_id = 2;
  string status = 3;
  optional int64 start_time = 4;
  optional int64 total_records = 5;
  optional string message = 6;
}

message TestProviderConnectionReq {
  string provider_type = 1;
  string provider_id = 2;
  string provider_config = 3;
}

message ProviderSchemaResp {
  string provider_type = 1;
  string provider_id = 2;
  string schema_json = 3;
}

message ListProvidersResp {
  repeated ProviderInfo providers = 1;
}

message ProviderInfo {
  string provider_type = 1;
  string provider_id = 2;
  string name = 3;
  string description = 4;
}

service Cmdb {

  // CiTypeDiscoveryConfig management
  // group: citypediscoveryconfig
  rpc createCiTypeDiscoveryConfig (CiTypeDiscoveryConfigInfo) returns (BaseIDResp);
  // group: citypediscoveryconfig
  rpc updateCiTypeDiscoveryConfig (CiTypeDiscoveryConfigInfo) returns (BaseResp);
  // group: citypediscoveryconfig
  rpc getCiTypeDiscoveryConfigList (CiTypeDiscoveryConfigListReq) returns (CiTypeDiscoveryConfigListResp);
  // group: citypediscoveryconfig
  rpc getCiTypeDiscoveryConfigById (IDReq) returns (CiTypeDiscoveryConfigInfo);
  // group: citypediscoveryconfig
  rpc deleteCiTypeDiscoveryConfig (IDsReq) returns (BaseResp);
  // group: citypediscoveryconfig
  rpc executeDiscovery (IDReq) returns (DiscoveryExecutionResp);
  // group: citypediscoveryconfig
  rpc testProviderConnection (TestProviderConnectionReq) returns (BaseResp);
  // group: citypediscoveryconfig
  rpc getProviderSchema (TestProviderConnectionReq) returns (ProviderSchemaResp);
  // group: citypediscoveryconfig
  rpc listProviders (Empty) returns (ListProvidersResp);

}