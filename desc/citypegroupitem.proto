syntax = "proto3";

// CiTypeGroupItem message

message CiTypeGroupItemInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  // Sort Number | 排序编号
  optional uint32 sort = 4;
  // 外键，关联cmdb_ci_type_groups.id
  optional uint64 group_id = 5;
  // 外键，关联cmdb_ci_types.id
  optional uint64 type_id = 6;
  // CI名称
  optional string name = 7;
}

message CiTypeGroupItemListResp {
  repeated CiTypeGroupItemInfo data = 1;
}

message CiTypeGroupItemTreeListInfo {
  optional uint64 group_id = 1;
  optional string name = 2;
  optional uint32 sort = 3;
  repeated CiTypeGroupItemInfo items = 4;
}

message CiTypeGroupItemTreeListResp {
  repeated CiTypeGroupItemTreeListInfo data = 1;
}


message CiTypeGroupItemListReq {
  optional uint64 group_id = 1;
  // 包含的CI类型ID列表 | Include specific CI type IDs
  repeated uint64 include_type_ids = 2;
  // 排除的CI类型ID列表 | Exclude specific CI type IDs  
  repeated uint64 exclude_type_ids = 3;
  // 包含的CI类型名称列表 | Include specific CI type names
  repeated string include_type_names = 4;
  // 排除的CI类型名称列表 | Exclude specific CI type names
  repeated string exclude_type_names = 5;
}

message CiTypeGroupItemSort {
  // 分组ID
  optional uint64 group_id = 1;
  // 属性ID
  optional uint64 type_id = 2;
  // 排序编号
  optional uint32 sort = 3;
}

message CiTypeGroupItemSortReq {
  repeated CiTypeGroupItemSort sort_items = 1;
}

service Cmdb {

  // CiTypeGroupItem management
  // group: citypegroupitem
  rpc createCiTypeGroupItem (CiTypeGroupItemInfo) returns (BaseIDResp);
  // group: citypegroupitem
  rpc updateCiTypeGroupItem (CiTypeGroupItemInfo) returns (BaseResp);
  // group: citypegroupitem
  rpc getCiTypeGroupItemList (CiTypeGroupItemListReq) returns (CiTypeGroupItemListResp);
  // group: citypegroupitem
  rpc getCiTypeGroupItemTreeList (CiTypeGroupItemListReq) returns (CiTypeGroupItemTreeListResp);
  // group: citypegroupitem
  rpc getCiTypeGroupItemById (IDReq) returns (CiTypeGroupItemInfo);
  // group: citypegroupitem
  rpc deleteCiTypeGroupItem (IDsReq) returns (BaseResp);
  // group: citypegroupitem
  rpc updateCiTypeGroupItemSort (CiTypeGroupItemSortReq) returns (BaseResp);


}