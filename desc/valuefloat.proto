syntax = "proto3";

// ValueFloat message

message ValueFloatInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  // 外键，关联cmdb_cis.id
  optional uint64 ci_id = 4;
  // 外键，关联cmdb_attributes.id
  optional uint64 attr_id = 5;
  // 属性值
  optional double value = 6;
  // 是否可被覆盖
  optional bool is_cover = 7;
}

message ValueFloatListResp {
  uint64 total = 1;
  repeated ValueFloatInfo data = 2;
}

message ValueFloatListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional int64 deleted_at = 5;
  optional uint64 ci_id = 6;
  optional uint64 attr_id = 7;
  optional double value = 8;
}


service Cmdb {

  // ValueFloat management
  // group: valuefloat
  rpc createValueFloat (ValueFloatInfo) returns (BaseIDResp);
  // group: valuefloat
  rpc updateValueFloat (ValueFloatInfo) returns (BaseResp);
  // group: valuefloat
  rpc getValueFloatList (ValueFloatListReq) returns (ValueFloatListResp);
  // group: valuefloat
  rpc getValueFloatById (IDReq) returns (ValueFloatInfo);
  // group: valuefloat
  rpc deleteValueFloat (IDsReq) returns (BaseResp);


}