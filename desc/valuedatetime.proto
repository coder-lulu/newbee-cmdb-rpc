syntax = "proto3";

// ValueDatetime message

message ValueDatetimeInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  // 外键，关联cmdb_cis.id
  optional uint64 ci_id = 4;
  // 外键，关联cmdb_attributes.id
  optional uint64 attr_id = 5;
  // 属性值
  optional int64  value = 6;
  // 是否可被覆盖
  optional bool is_cover = 7;
}

message ValueDatetimeListResp {
  uint64 total = 1;
  repeated ValueDatetimeInfo data = 2;
}

message ValueDatetimeListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional int64 deleted_at = 5;
  optional uint64 ci_id = 6;
  optional uint64 attr_id = 7;
  optional int64 value = 8;
}


service Cmdb {

  // ValueDatetime management
  // group: valuedatetime
  rpc createValueDatetime (ValueDatetimeInfo) returns (BaseIDResp);
  // group: valuedatetime
  rpc updateValueDatetime (ValueDatetimeInfo) returns (BaseResp);
  // group: valuedatetime
  rpc getValueDatetimeList (ValueDatetimeListReq) returns (ValueDatetimeListResp);
  // group: valuedatetime
  rpc getValueDatetimeById (IDReq) returns (ValueDatetimeInfo);
  // group: valuedatetime
  rpc deleteValueDatetime (IDsReq) returns (BaseResp);


}