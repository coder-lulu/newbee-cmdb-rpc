syntax = "proto3";

// ValueInteger message

message ValueIntegerInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  // 外键，关联cmdb_cis.id
  optional uint64 ci_id = 4;
  // 外键，关联cmdb_attributes.id
  optional uint64 attr_id = 5;
  // 属性值
  optional int64 value = 6;
  // 是否可被覆盖
  optional bool is_cover = 7;
}

message ValueIntegerListResp {
  uint64 total = 1;
  repeated ValueIntegerInfo data = 2;
}

message ValueIntegerListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional int64 deleted_at = 5;
  optional uint64 ci_id = 6;
  optional uint64 attr_id = 7;
  optional int64 value = 8;
}


service Cmdb {

  // ValueInteger management
  // group: valueinteger
  rpc createValueInteger (ValueIntegerInfo) returns (BaseIDResp);
  // group: valueinteger
  rpc updateValueInteger (ValueIntegerInfo) returns (BaseResp);
  // group: valueinteger
  rpc getValueIntegerList (ValueIntegerListReq) returns (ValueIntegerListResp);
  // group: valueinteger
  rpc getValueIntegerById (IDReq) returns (ValueIntegerInfo);
  // group: valueinteger
  rpc deleteValueInteger (IDsReq) returns (BaseResp);


}