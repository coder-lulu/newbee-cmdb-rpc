  repeated CiRelationInfo data = 2;
}

//  关系查询结果
message CiRelationQueryResult {
  //  作为源CI的关系
  repeated CiRelationInfo source_relations = 1;
  //  作为目标CI的关系
  repeated CiRelationInfo target_relations = 2;
  //  关系总数
  uint64 total_count = 3;
}

//  更新关系信息
message CiRelationUpdateInfo {
  //  关系ID
  uint64 relation_id = 1;
  //  目标CI ID（可选，允许修改）
  optional uint64 target_ci_id = 2;
  //  关系类型ID（可选，允许修改）
  optional uint64 relation_type_id = 3;
  //  更多CI ID（可选）
  optional uint64 more_ci_id = 4;
  //  关系属性
  optional string properties = 5;
  //  属性映射数据
  repeated AttributeMappingData attribute_mappings = 6;
  //  关系状态
  optional string status = 7;
  //  关系强度
  optional string relation_strength = 8;
}

//  CI关系数据结构
message CiRelationsData {
  //  要创建的关系（创建/更新时使用）
  repeated CiRelationCreateInfo create_relations = 1;
  //  要更新的关系（更新时使用）
  repeated CiRelationUpdateInfo update_relations = 2;
  //  要删除的关系ID列表（更新时使用）
  repeated uint64 delete_relation_ids = 3;
  //  查询结果中的关系数据（查询时返回）
  optional CiRelationQueryResult query_result = 4;
}

//  排序条件
message CiSortField {
  //  属性ID（0表示基础字段）
  uint64 attr_id = 1;
  //  字段名称（基础字段：id, created_at, updated_at, type_id等）
  optional string field_name = 2;
  //  排序方向：asc, desc
  string direction = 3;
  //  数据类型（用于正确排序）
  optional string value_type = 4;
}

//  标签过滤条件
message CiTagFilter {
  //  标签键
  string key = 1;
  //  标签值列表
  repeated string values = 2;
  //  操作符: eq, ne, in, not_in, exists, not_exists
  string operator = 3;
}

//  时间范围搜索条件
message CiTimeRangeSearch {
  //  时间字段: created_at, updated_at 或属性ID
  string field = 1;
  //  开始时间（毫秒时间戳）
  optional int64 start_time = 2;
  //  结束时间（毫秒时间戳）
  optional int64 end_time = 3;
  //  时间间隔：hour, day, week, month
  optional string interval = 4;
}

