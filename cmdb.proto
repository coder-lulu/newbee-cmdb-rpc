syntax = "proto3";

package cmdb;
option go_package = "./cmdb";

//  异步任务相关消息定义
message AsyncTaskReq {
  string type = 1;
  string operation = 2;
  repeated uint64 ci_ids = 3;
  optional string params = 4;
  optional string data = 5;
  optional int32 priority = 6;
  optional string created_by = 7;
}

message AsyncTaskResp {
  string task_id = 1;
  string message = 2;
  bool success = 3;
  optional TaskStatusInfo initial_status = 4;
}

//  选项
message AttributeChoiceItem {
  //  选项ID
  optional uint64 id = 1;
  //  选项值
  string value = 2;
  //  选项元信息
  AttributeChoiceItemMeta meta = 3;
}

//  选项元信息
message AttributeChoiceItemMeta {
  string icon = 1;
  string label = 2;
  AttributeFontOption style = 3;
}

message AttributeChoiceOther {
  optional string filter = 1;
  optional uint64 attr_id = 2;
  repeated uint64 type_ids = 3;
}

message AttributeChoiceWebHook {
  optional string url = 1;
  optional string method = 2;
  optional string body = 3;
  optional string headers = 4;
  optional string params = 5;
  optional string response_type = 6;
  optional string response_format = 7;
}

message AttributeDefault {
  optional string default = 1;
}

message AttributeFontOption {
  optional string color = 1;
  optional string bgColor = 2;
  optional string fontStyle = 3;
  optional string fontWeight = 4;
  optional string textDecoration = 5;
}

message AttributeImageOption {
  string path = 1;
  string name = 2;
  uint32 height = 3;
  uint32 width = 4;
}

message AttributeInfo {
  optional uint64 id = 1;
  //  属性名
  optional string name = 2;
  //  属性别名
  optional string alias = 3;
  //  值类型，枚举
  optional string value_type = 4;
  //  是否为选项
  optional bool is_choice = 5;
  //  是否为列表
  optional bool is_list = 6;
  //  用户ID/创建者
  optional string created_by = 7;
  //  是否计算属性
  optional bool is_computed = 8;
  //  选项webhook
  optional AttributeChoiceWebHook choice_web_hook = 9;
  //  选项内容
  optional AttributeOption option = 10;
  //  是否为密码
  optional bool is_password = 11;
  //  计算脚本
  optional string compute_script = 12;
  //  计算表达式
  optional string compute_expr = 13;
  //  是否可排序
  optional bool is_sortable = 14;
  //  默认值
  optional AttributeDefault default = 15;
  //  是否动态
  optional bool is_dynamic = 16;
  //  是否引用
  optional bool is_reference = 17;
  //  引用类型ID
  optional uint64 reference_type_id = 18;
  //  其他选项
  optional AttributeChoiceOther choice_other = 19;
  //  choices
  repeated AttributeChoiceItem choices = 20;
  //  效验规则
  repeated ValidationRule validator_rules = 21;
}

message AttributeListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional string name = 3;
  optional string alias = 4;
}

message AttributeListResp {
  uint64 total = 1;
  repeated AttributeInfo data = 2;
}

message AttributeOption {
  optional AttributeFontOption fontOption = 1;
  repeated AttributeImageOption imageOptions = 2;
}

message AttributeSimple {
  optional uint64 id = 1;
  optional string name = 2;
  optional string alias = 3;
  optional string value_type = 4;
  optional bool is_choice = 5;
  optional bool is_list = 6;
}

message AttributeSimpleListReq {
  optional uint64 exclude_ci_type = 1;
  optional string name = 2;
  optional string alias = 3;
}

message AttributeSimpleListResp {
  uint64 total = 1;
  repeated AttributeSimple data = 2;
}

message BaseIDInt32Resp {
  int32 id = 1;
  string msg = 2;
}

message BaseIDInt64Resp {
  int64 id = 1;
  string msg = 2;
}

message BaseIDResp {
  uint64 id = 1;
  string msg = 2;
}

message BaseIDStringResp {
  string id = 1;
  string msg = 2;
}

message BaseIDUint32Resp {
  uint32 id = 1;
  string msg = 2;
}

message BaseResp {
  string msg = 1;
}

message BaseUUIDResp {
  string id = 1;
  string msg = 2;
}

message ChoiceFloatInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  //  外键，关联cmdb_attributes.id
  optional uint64 attr_id = 4;
  //  选项值
  optional double value = 5;
  //  选项内容
  optional AttributeChoiceItemMeta option = 6;
}

message ChoiceFloatListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional int64 deleted_at = 5;
  optional uint64 attr_id = 6;
  optional double value = 7;
  optional AttributeChoiceItemMeta option = 8;
}

message ChoiceFloatListResp {
  uint64 total = 1;
  repeated ChoiceFloatInfo data = 2;
}

message ChoiceIntegerInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  //  外键，关联cmdb_attributes.id
  optional uint64 attr_id = 4;
  //  选项值
  optional int64 value = 5;
  //  选项内容
  optional AttributeChoiceItemMeta option = 6;
}

message ChoiceIntegerListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional int64 deleted_at = 5;
  optional uint64 attr_id = 6;
  optional int64 value = 7;
  optional AttributeChoiceItemMeta option = 8;
}

message ChoiceIntegerListResp {
  uint64 total = 1;
  repeated ChoiceIntegerInfo data = 2;
}

message ChoiceTextInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  //  外键，关联cmdb_attributes.id
  optional uint64 attr_id = 4;
  //  选项内容
  optional string value = 5;
  //  选项内容
  optional AttributeChoiceItemMeta option = 6;
}

message ChoiceTextListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional int64 deleted_at = 5;
  optional uint64 attr_id = 6;
  optional string value = 7;
  optional AttributeChoiceItemMeta option = 8;
}

message ChoiceTextListResp {
  uint64 total = 1;
  repeated ChoiceTextInfo data = 2;
}

//  属性错误信息
message CiAttributeError {
  uint64 attr_id = 1;
  string attr_name = 2;
  string error_type = 3;
  string message = 4;
}

//  高级属性过滤条件
message CiAttributeFilter {
  //  属性ID
  uint64 attr_id = 1;
  //  属性名称（可选，用于调试）
  optional string attr_name = 2;
  //  属性值类型（用于类型转换）
  string value_type = 3;
  //  操作符
  string operator = 4;
  //  过滤值（JSON格式存储）
  optional string value = 5;
  //  多个值（JSON数组格式）
  optional string values = 6;
  //  列表过滤模式：any(任意匹配), all(全部匹配), exact(精确匹配)
  optional string list_mode = 7;
}

//  CI实例属性值
message CiAttributeValue {
  //  属性ID
  uint64 attr_id = 1;
  //  属性名称（冗余字段，便于前端使用）
  string attr_name = 2;
  //  属性别名
  string attr_alias = 3;
  //  属性值类型
  string value_type = 4;
  //  属性值（根据类型格式化的字符串）
  string value = 5;
  //  原始值（用于编辑，JSON格式）
  optional string raw_value = 6;
}

//  分面搜索条件
message CiFacetSearch {
  //  需要分面统计的字段
  repeated string fields = 1;
  //  每个分面返回的项目数量
  optional int32 size = 2;
}

//  复合过滤条件组
message CiFilterGroup {
  //  逻辑操作符：and, or
  string logic = 1;
  //  属性过滤条件列表
  repeated CiAttributeFilter filters = 2;
  //  嵌套过滤组
  repeated CiFilterGroup groups = 3;
}

//  继承搜索条件
message CiInheritanceSearch {
  //  是否包含子类型
  optional bool include_children = 1;
  //  是否包含父类型
  optional bool include_parents = 2;
  //  指定类型层级
  repeated uint64 type_hierarchy = 3;
}

//  元数据过滤条件
message CiMetadataFilter {
  //  JSON路径，如 "system.version"
  string path = 1;
  //  过滤值
  optional string value = 2;
  //  操作符: eq, ne, gt, lt, contains, exists
  string operator = 3;
}

//  允许的字段值范围结构
message CiPermissionAllowedValues {
  //  操作符: eq, ne, gt, lt, contains, exists
  map<string,string> field_values = 1;
}

//  权限条件结构
message CiPermissionConditions {
  string field = 1;
  string operator = 2;
  string value = 3;
  string logic = 4;
}

//  数据过滤规则结构
message CiPermissionDataFilters {
  repeated CiPermissionFilterRule rules = 1;
  string logic = 2;
}

//  字段掩码结构
message CiPermissionFieldMasks {
  repeated string fields = 1;
}

//  过滤规则
message CiPermissionFilterRule {
  string field = 1;
  string operator = 2;
  string value = 3;
}

message CiPermissionInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  //  Department ID | 部门 ID
  optional uint64 department_id = 4;
  //  权限ID，全局唯一标识
  optional string permission_id = 5;
  //  权限范围类型
  optional string scope_type = 6;
  //  CI类型ID，当scope_type为ci_type时必填
  optional uint64 ci_type_id = 7;
  //  CI实例ID，当scope_type为ci_instance时必填
  optional uint64 ci_id = 8;
  //  属性ID，当scope_type为attribute时必填
  optional uint64 attribute_id = 9;
  //  字段名称，当scope_type为field时必填
  optional string field_name = 10;
  //  权限主体类型
  optional string subject_type = 11;
  //  权限主体ID
  optional string subject_id = 12;
  //  权限主体名称
  optional string subject_name = 13;
  //  权限主体编码
  optional string subject_code = 14;
  //  权限类型：允许或拒绝
  optional string permission_type = 15;
  //  允许的操作：read, write, create, update, delete, import, export, approve
  optional CiPermissionOperations operations = 16;
  //  权限条件，支持复杂的条件表达式
  optional CiPermissionConditions conditions = 17;
  //  权限优先级，数值越大优先级越高
  optional int64 priority = 18;
  //  权限级别
  optional string permission_level = 19;
  //  权限生效开始时间
  optional int64 effective_from = 20;
  //  权限生效结束时间
  optional int64 effective_to = 21;
  //  是否为临时权限
  optional bool is_temporary = 22;
  //  数据过滤规则，用于行级权限控制
  optional CiPermissionDataFilters data_filters = 23;
  //  字段掩码列表，隐藏敏感字段
  optional CiPermissionFieldMasks field_masks = 24;
  //  允许的字段值范围
  optional CiPermissionAllowedValues allowed_values = 25;
  //  是否需要审批
  optional bool require_approval = 26;
  //  授权人ID
  optional string granted_by = 27;
  //  授权人姓名
  optional string granted_by_name = 28;
  //  授权时间
  optional int64 granted_at = 29;
  //  授权原因
  optional string grant_reason = 30;
  //  权限使用次数
  optional int64 usage_count = 31;
  //  最后使用时间
  optional int64 last_used_at = 32;
  //  使用统计信息
  optional CiPermissionUsageStatistics usage_statistics = 33;
  //  权限状态
  optional uint32 status = 34;
  //  状态变更原因
  optional string status_reason = 35;
  //  是否可继承给子级
  optional bool inheritable = 36;
  //  父权限ID
  optional string parent_permission_id = 37;
  //  继承来源权限ID列表
  optional CiPermissionInheritedFrom inherited_from = 38;
  //  风险等级
  optional string risk_level = 39;
  //  是否需要多因素认证
  optional bool require_mfa = 40;
  //  安全约束条件
  optional CiPermissionSecurityConstraints security_constraints = 41;
  //  元数据信息
  optional CiPermissionMetadata metadata = 42;
  //  标签列表
  repeated CiPermissionTag tags = 43;
  //  权限描述
  optional string description = 44;
  //  备注信息
  optional string comments = 45;
  //  创建人ID
  optional string created_by = 46;
  //  最后更新人ID
  optional string updated_by = 47;
  //  最后审查时间
  optional int64 last_reviewed_at = 48;
  //  最后审查人ID
  optional string last_reviewed_by = 49;
}

//  继承来源结构
message CiPermissionInheritedFrom {
  repeated string permission_ids = 1;
}

message CiPermissionListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional uint64 department_id = 5;
  optional string permission_id = 6;
  optional string scope_type = 7;
  optional uint64 ci_type_id = 8;
  optional uint64 ci_id = 9;
  optional uint64 attribute_id = 10;
  optional string field_name = 11;
  optional string subject_type = 12;
  optional string subject_id = 13;
  optional string subject_name = 14;
  optional string subject_code = 15;
  optional string permission_type = 16;
  optional CiPermissionOperations operations = 17;
  optional CiPermissionConditions conditions = 18;
  optional int64 priority = 19;
  optional string permission_level = 20;
  optional int64 effective_from = 21;
  optional int64 effective_to = 22;
  optional bool is_temporary = 23;
  optional CiPermissionDataFilters data_filters = 24;
  optional CiPermissionFieldMasks field_masks = 25;
  optional CiPermissionAllowedValues allowed_values = 26;
  optional bool require_approval = 27;
  optional string granted_by = 28;
  optional string granted_by_name = 29;
  optional int64 granted_at = 30;
  optional string grant_reason = 31;
  optional int64 usage_count = 32;
  optional int64 last_used_at = 33;
  optional CiPermissionUsageStatistics usage_statistics = 34;
  optional string status = 35;
  optional string status_reason = 36;
  optional bool inheritable = 37;
  optional string parent_permission_id = 38;
  optional CiPermissionInheritedFrom inherited_from = 39;
  optional string risk_level = 40;
  optional bool require_mfa = 41;
  optional CiPermissionSecurityConstraints security_constraints = 42;
  optional CiPermissionMetadata metadata = 43;
  repeated CiPermissionTag tags = 44;
  optional string description = 45;
  optional string comments = 46;
  optional string created_by = 47;
  optional string updated_by = 48;
  optional int64 last_reviewed_at = 49;
  optional string last_reviewed_by = 50;
}

message CiPermissionListResp {
  uint64 total = 1;
  repeated CiPermissionInfo data = 2;
}

//  元数据信息结构
message CiPermissionMetadata {
  string business_owner = 1;
  string technical_owner = 2;
  string data_class = 3;
  repeated string compliance_reqs = 4;
  map<string,string> custom_fields = 5;
}

//  权限操作结构
message CiPermissionOperation {
  string operation = 1;
  string description = 2;
}

message CiPermissionOperations {
  repeated CiPermissionOperation operations = 1;
}

//  安全约束条件结构
message CiPermissionSecurityConstraints {
  bool require_vpn = 1;
  repeated string allowed_ips = 2;
  repeated string blocked_ips = 3;
  TimeRestriction time_restrictions = 4;
  LocationRestriction location_restrictions = 5;
}

//  标签结构
message CiPermissionTag {
  string key = 1;
  string value = 2;
}

//  使用统计信息结构
message CiPermissionUsageStatistics {
  map<string,int64> daily_usage = 1;
  map<string,int64> weekly_usage = 2;
  map<string,int64> monthly_usage = 3;
  repeated OperationStat top_operations = 4;
}

//  关系过滤条件
message CiRelationFilter {
  //  关系类型编码
  string relation_type = 1;
  //  关系方向: incoming(入关系), outgoing(出关系), both(双向)
  string direction = 2;
  //  目标CI ID列表
  repeated uint64 target_ci_ids = 3;
  //  目标CI类型ID列表
  repeated uint64 target_type_ids = 4;
  //  关系深度，0表示直接关系
  optional int32 relation_depth = 5;
  //  是否包含间接关系
  optional bool include_indirect = 6;
}

message CiRelationInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  //  外键，关联cmdb_cis.id，第一CI
  optional uint64 first_ci_id = 4;
  //  外键，关联cmdb_cis.id，第二CI
  optional uint64 second_ci_id = 5;
  //  外键，关联cmdb_relation_types.id
  optional uint64 relation_type_id = 6;
  //  更多CI，外键，关联cmdb_cis.id
  optional uint64 more = 7;
  //  来源，枚举类
  optional string source = 8;
  //  祖先ID
  optional string ancestor_ids = 9;
}

message CiRelationListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional int64 deleted_at = 5;
  optional uint64 first_ci_id = 6;
  optional uint64 second_ci_id = 7;
  optional uint64 relation_type_id = 8;
  optional uint64 more = 9;
  optional string source = 10;
  optional string ancestor_ids = 11;
}

message CiRelationListResp {
  uint64 total = 1;
  repeated CiRelationInfo data = 2;
}

//  排序条件
message CiSortField {
  //  属性ID（0表示基础字段）
  uint64 attr_id = 1;
  //  字段名称（基础字段：id, created_at, updated_at, type_id等）
  optional string field_name = 2;
  //  排序方向：asc, desc
  string direction = 3;
  //  数据类型（用于正确排序）
  optional string value_type = 4;
}

//  标签过滤条件
message CiTagFilter {
  //  标签键
  string key = 1;
  //  标签值列表
  repeated string values = 2;
  //  操作符: eq, ne, in, not_in, exists, not_exists
  string operator = 3;
}

//  时间范围搜索条件
message CiTimeRangeSearch {
  //  时间字段: created_at, updated_at 或属性ID
  string field = 1;
  //  开始时间（毫秒时间戳）
  optional int64 start_time = 2;
  //  结束时间（毫秒时间戳）
  optional int64 end_time = 3;
  //  时间间隔：hour, day, week, month
  optional string interval = 4;
}

message CiTypeAppendAttributeReq {
  optional uint64 type_id = 1;
  repeated uint64 attr_ids = 2;
  optional uint64 group_id = 3;
}

message CiTypeAttributeChangeDefaultShowReq {
  uint64 ci_type_attribute_id = 1;
  bool list_show = 2;
}

message CiTypeAttributeGroupInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  //  Sort Number | 排序编号
  optional uint32 sort = 4;
  //  分组名称
  optional string name = 5;
  //  外键，关联cmdb_ci_types.id
  optional uint64 type_id = 6;
}

message CiTypeAttributeGroupItemInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  //  Sort Number | 排序编号
  optional uint32 sort = 4;
  //  外键，关联cmdb_ci_type_attribute_groups.id
  optional uint64 group_id = 5;
  //  外键，关联cmdb_attributes.id
  optional uint64 attr_id = 6;
}

message CiTypeAttributeGroupItemListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional int64 deleted_at = 5;
  optional uint32 sort = 6;
  optional uint64 group_id = 7;
  optional uint64 attr_id = 8;
}

message CiTypeAttributeGroupItemListResp {
  uint64 total = 1;
  repeated CiTypeAttributeGroupItemInfo data = 2;
}

message CiTypeAttributeGroupItemSort {
  uint64 group_id = 1;
  repeated CiTypeAttributeGroupItemSortItem items = 2;
}

message CiTypeAttributeGroupItemSortItem {
  uint64 id = 1;
  uint32 sort = 2;
}

message CiTypeAttributeGroupItemSortReq {
  repeated CiTypeAttributeGroupItemSort data = 1;
}

message CiTypeAttributeGroupListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional int64 deleted_at = 5;
  optional uint32 sort = 6;
  optional string name = 7;
  optional uint64 type_id = 8;
}

message CiTypeAttributeGroupListResp {
  uint64 total = 1;
  repeated CiTypeAttributeGroupInfo data = 2;
}

message CiTypeAttributeGroupSort {
  uint64 group_id = 1;
  string name = 2;
  uint32 sort = 3;
}

message CiTypeAttributeGroupSortReq {
  repeated CiTypeAttributeGroupSort data = 1;
}

message CiTypeAttributeInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  //  外键，关联cmdb_ci_types.id
  optional uint64 type_id = 5;
  //  外键，关联cmdb_attributes.id
  optional uint64 attr_id = 6;
  //  是否必填
  optional bool is_required = 7;
  //  是否唯一
  optional bool is_unique = 8;
  //  是否列表
  optional bool is_list = 9;
  //  是否列表展示
  optional bool list_show = 10;
  //  是否详情展示
  optional bool detail_show = 11;
  //  是否可编辑
  optional bool is_edit = 12;
}

//  主属性项
message CiTypeAttributeItem {
  AttributeInfo attribute = 1;
  optional uint64 group_id = 2;
  uint64 type_id = 3;
  optional bool is_required = 4;
  optional bool is_edit = 5;
  optional bool list_show = 6;
  optional bool detail_show = 7;
  optional uint64 id = 8;
  optional uint32 sort = 9;
  optional uint64 ci_type_attribute_id = 10;
  optional bool is_unique = 11;
  optional bool is_inherited = 12;
}

message CiTypeAttributeListReq {
  uint64 page = 1;
  uint64 page_size = 2;
  optional int64 created_at = 3;
  optional int64 updated_at = 4;
  optional int64 deleted_at = 5;
  optional uint32 sort = 6;
  optional uint64 type_id = 7;
  optional uint64 attr_id = 8;
  optional bool is_required = 9;
  optional bool list_show = 10;
}

message CiTypeAttributeListResp {
  uint64 total = 1;
  repeated CiTypeAttributeItem data = 2;
}

message CiTypeAttributeListWithGroupInfo {
  uint64 group_id = 1;
  uint32 sort = 2;
  string name = 3;
  uint64 type_id = 4;
  repeated CiTypeAttributeItem attributes = 5;
}

message CiTypeAttributeListWithGroupReq {
  uint64 type_id = 1;
}

message CiTypeAttributeListWithGroupResp {
  repeated CiTypeAttributeListWithGroupInfo data = 1;
}

message CiTypeGroupInfo {
  optional uint64 id = 1;
  optional int64 created_at = 2;
  optional int64 updated_at = 3;
  //  Sort Number | 排序编号
  optional uint32 sort = 4;
  //  分组名称
  optional string name = 5;
