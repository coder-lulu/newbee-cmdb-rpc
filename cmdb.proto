service Cmdb {
  //  异步任务管理接口
  //  group: async_task
  rpc SubmitAsyncTask(AsyncTaskReq) returns (AsyncTaskResp);
  //  group: async_task
  rpc GetTaskStatus(TaskStatusReq) returns (TaskStatusResp);
  //  group: async_task
  rpc CancelTask(TaskCancelReq) returns (BaseResp);
  //  group: async_task
  rpc GetTaskList(TaskListReq) returns (TaskListResp);
  //  group: async_task
  rpc GetTaskStats(TaskStatsReq) returns (TaskStatsResp);
  //  Attribute management
  //  group: attribute
  rpc createAttribute(AttributeInfo) returns (BaseIDResp);
  //  group: attribute
  rpc updateAttribute(AttributeInfo) returns (BaseIDResp);
  //  group: attribute
  rpc getAttributeList(AttributeListReq) returns (AttributeListResp);
  //  group: attribute
  rpc getAttributeSimpleList(AttributeSimpleListReq) returns (AttributeSimpleListResp);
  //  group: attribute
  rpc getAttributeById(IDReq) returns (AttributeInfo);
  //  group: attribute
  rpc deleteAttribute(IDsReq) returns (BaseResp);
  //  group: base
  rpc initDatabase(Empty) returns (BaseResp);
  //  ChoiceFloat management
  //  group: choicefloat
  rpc createChoiceFloat(ChoiceFloatInfo) returns (BaseIDResp);
  //  group: choicefloat
  rpc updateChoiceFloat(ChoiceFloatInfo) returns (BaseResp);
  //  group: choicefloat
  rpc getChoiceFloatList(ChoiceFloatListReq) returns (ChoiceFloatListResp);
  //  group: choicefloat
  rpc getChoiceFloatById(IDReq) returns (ChoiceFloatInfo);
  //  group: choicefloat
  rpc deleteChoiceFloat(IDsReq) returns (BaseResp);
  //  ChoiceInteger management
  //  group: choiceinteger
  rpc createChoiceInteger(ChoiceIntegerInfo) returns (BaseIDResp);
  //  group: choiceinteger
  rpc updateChoiceInteger(ChoiceIntegerInfo) returns (BaseResp);
  //  group: choiceinteger
  rpc getChoiceIntegerList(ChoiceIntegerListReq) returns (ChoiceIntegerListResp);
  //  group: choiceinteger
  rpc getChoiceIntegerById(IDReq) returns (ChoiceIntegerInfo);
  //  group: choiceinteger
  rpc deleteChoiceInteger(IDsReq) returns (BaseResp);
  //  ChoiceText management
  //  group: choicetext
  rpc createChoiceText(ChoiceTextInfo) returns (BaseIDResp);
  //  group: choicetext
  rpc updateChoiceText(ChoiceTextInfo) returns (BaseResp);
  //  group: choicetext
  rpc getChoiceTextList(ChoiceTextListReq) returns (ChoiceTextListResp);
  //  group: choicetext
  rpc getChoiceTextById(IDReq) returns (ChoiceTextInfo);
  //  group: choicetext
  rpc deleteChoiceText(IDsReq) returns (BaseResp);
  //  CiPermission management
  //  group: cipermission
  rpc createCiPermission(CiPermissionInfo) returns (BaseIDResp);
  //  group: cipermission
  rpc updateCiPermission(CiPermissionInfo) returns (BaseResp);
  //  group: cipermission
  rpc getCiPermissionList(CiPermissionListReq) returns (CiPermissionListResp);
  //  group: cipermission
  rpc getCiPermissionById(IDReq) returns (CiPermissionInfo);
  //  group: cipermission
  rpc deleteCiPermission(IDsReq) returns (BaseResp);
  //  CiRelation management
  //  group: cirelation
  rpc createCiRelation(CiRelationInfo) returns (BaseIDResp);
  //  group: cirelation
  rpc updateCiRelation(CiRelationInfo) returns (BaseResp);
  //  group: cirelation
  rpc getCiRelationList(CiRelationListReq) returns (CiRelationListResp);
  //  group: cirelation
  rpc getCiRelationById(IDReq) returns (CiRelationInfo);
  //  group: cirelation
  rpc deleteCiRelation(IDsReq) returns (BaseResp);
  //  Cis management
  //  group: cis
  rpc createCis(CisInfo) returns (BaseIDResp);
  //  group: cis
  rpc updateCis(CisInfo) returns (BaseResp);
  //  group: cis
  rpc getCisList(CisListReq) returns (CisListResp);
  //  group: cis
  rpc getCisById(IDReq) returns (CisInfo);
  //  group: cis
  rpc getCisDetailById(IDReq) returns (CisDetailInfo);
  //  group: cis
  rpc deleteCis(IDsReq) returns (BaseResp);
  //  group: cis
  rpc cisBatchOperation(CisBatchOperationReq) returns (BaseResp);
  //  group: cis
  rpc validateCisAttributes(CisAttributeValidateReq) returns (CisAttributeValidateResp);
  //  CiType management
  //  group: citype
  rpc createCiType(CiTypeInfo) returns (BaseIDResp);
  //  group: citype
  rpc updateCiType(CiTypeInfo) returns (BaseResp);
  //  group: citype
  rpc getCiTypeList(CiTypeListReq) returns (CiTypeListResp);
  //  group: citype
  rpc getCiTypeById(IDReq) returns (CiTypeInfo);
  //  group: citype
  rpc deleteCiType(IDsReq) returns (BaseResp);
  //  group: citype
  rpc appendAttribute(CiTypeAppendAttributeReq) returns (BaseResp);
  //  CiTypeAttribute management
  //  group: citypeattribute
  rpc createCiTypeAttribute(CiTypeAttributeItem) returns (BaseResp);
  //  group: citypeattribute
  rpc updateCiTypeAttribute(CiTypeAttributeItem) returns (BaseResp);
  //  group: citypeattribute
  rpc getCiTypeAttributeList(CiTypeAttributeListReq) returns (CiTypeAttributeListResp);
  //  group: citypeattribute
  rpc getCiTypeAttributeById(IDReq) returns (CiTypeAttributeItem);
  //  group: citypeattribute
  rpc deleteCiTypeAttribute(IDsReq) returns (BaseResp);
  //  group: citypeattribute
  rpc getCiTypeAttributeListWithGroup(CiTypeAttributeListWithGroupReq) returns (CiTypeAttributeListWithGroupResp);
  //  group: citypeattribute
  rpc changeCiTypeAttributeDefaultShow(CiTypeAttributeChangeDefaultShowReq) returns (BaseResp);
  //  CiTypeAttributeGroup management
  //  group: citypeattributegroup
  rpc createCiTypeAttributeGroup(CiTypeAttributeGroupInfo) returns (BaseIDResp);
  //  group: citypeattributegroup
  rpc updateCiTypeAttributeGroup(CiTypeAttributeGroupInfo) returns (BaseResp);
